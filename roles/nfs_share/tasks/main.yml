---

- name: Install prerequisites
  apt:
    pkg:
      - nfs-kernel-server
    state: present
    update_cache: true

- name: Ensure /export root path exists
  ansible.builtin.file:
    path: /export
    state: directory

- name: Add /export root entry
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "/export    {{ nfs_share_allowed_ips | map('regex_replace', '^(.*)$', '\\1(' + nfs_export_root_options + ')') | join(' ') if nfs_share_allowed_ips else '*(' + nfs_export_root_options + ')' }}"
    regexp: "^/export\\s"
    state: present
  notify: Re-export NFS shares

- name: Ensure share source path exists
  ansible.builtin.file:
    path: "{{ nfs_share_src }}"
    state: directory

- name: Ensure export path exists
  ansible.builtin.file:
    path: "{{ nfs_share_export }}"
    state: directory

- name: Bind mount source path to export path
  ansible.posix.mount:
    src: "{{ nfs_share_src }}"
    path: "{{ nfs_share_export }}"
    fstype: none
    opts: bind
    state: mounted
  when: nfs_share_src != nfs_share_export

- name: Add export entry
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_share_export }}    {{ nfs_share_allowed_ips | map('regex_replace', '^(.*)$', '\\1(' + nfs_share_client_options + ')') | join(' ') if nfs_share_allowed_ips else '*(' + nfs_share_client_options + ')' }}"
    regexp: "^{{ nfs_share_export | regex_escape() }}\\s"
    state: present
  notify: Re-export NFS shares

- name: Enable and start nfs-kernel-server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    state: started
    enabled: true
