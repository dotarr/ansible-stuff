---

- name: Ensure curl is installed
  ansible.builtin.apt:
    name: curl
    state: present

- name: Copy modprobe config
  template:
    src: i915.j2
    dest: /etc/modprobe.d/i915.conf
  notify: Update initramfs

- name: load ip6_table module
  community.general.modprobe:
    name: ip6_tables
    persistent: present

- name: Copy i915 firmware update script
  ansible.builtin.template:
    src: update-i915-firmware.sh.j2
    dest: /usr/local/sbin/update-i915-firmware.sh
    owner: root
    group: root
    mode: '0755'

- name: Copy i915 firmware update systemd service
  ansible.builtin.template:
    src: i915-firmware-update.service.j2
    dest: /etc/systemd/system/i915-firmware-update.service
    owner: root
    group: root
    mode: '0644'

- name: Copy i915 firmware update systemd timer
  ansible.builtin.template:
    src: i915-firmware-update.timer.j2
    dest: /etc/systemd/system/i915-firmware-update.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable and start i915 firmware update timer
  ansible.builtin.systemd:
    name: i915-firmware-update.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Run i915 firmware update script
  ansible.builtin.command: /usr/local/sbin/update-i915-firmware.sh
  register: i915_firmware_update
  changed_when: i915_firmware_update.rc == 10
  failed_when: i915_firmware_update.rc not in [0, 10]
  notify: Reboot
