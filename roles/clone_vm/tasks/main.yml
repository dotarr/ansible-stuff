---
- name: Get next free VM ID
  ansible.builtin.command: pvesh get /cluster/nextid
  register: vmid
  changed_when: false

- name: Clone VM
  ansible.builtin.command: "qm clone {{ template_id }} {{ vmid.stdout }} --name {{ vm_name }} --full true"

- name: Convert boot disk to qcow2 (raw disks on dir storage can't be snapshotted)
  ansible.builtin.command: "qm disk move {{ vmid.stdout }} scsi0 local --format qcow2 --delete"

- name: Override CPU cores
  ansible.builtin.command: "qm set {{ vmid.stdout }} -cores {{ cpu_cores }}"
  when: cpu_cores is defined

- name: Override RAM allocation
  ansible.builtin.command: "qm set {{ vmid.stdout }} -memory {{ ram }}"
  when: ram is defined

- name: Passthrough GPU
  ansible.builtin.command: "qm set {{ vmid.stdout }} -hostpci0 {{ gpu_pci_address }},pcie=on"
  when: passthrough_gpu

- name: Passthrough SSD
  ansible.builtin.command: "qm set {{ vmid.stdout }} -scsi2 /dev/disk/by-id/{{ passthrough_ssd_id }}"
  when: passthrough_ssd_id is defined
