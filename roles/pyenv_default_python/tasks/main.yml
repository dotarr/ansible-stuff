---

- name: Look up pyenv_default_python_user's home dir
  ansible.builtin.getent:
    database: passwd
    key: "{{ pyenv_default_python_user }}"

- name: Determine latest stable Python 3 release
  become: "{{ pyenv_default_python_user != ansible_user }}"
  become_user: "{{ pyenv_default_python_user }}"
  ansible.builtin.shell: >-
    {{ pyenv_default_python_root }}/bin/pyenv install --list
    | grep -E '^\s*3\.[0-9]+\.[0-9]+$'
    | tr -d ' '
    | sort -V
    | tail -n1
  register: pyenv_latest_python
  changed_when: false
  when: pyenv_default_python_version == ""

- name: Use detected latest Python version
  ansible.builtin.set_fact:
    pyenv_default_python_version: "{{ pyenv_latest_python.stdout }}"
  when: pyenv_default_python_version == ""

- name: Check if Python {{ pyenv_default_python_version }} is already built
  ansible.builtin.stat:
    path: "{{ pyenv_default_python_root }}/versions/{{ pyenv_default_python_version }}/bin/python"
  register: pyenv_python_installed

- name: Build Python {{ pyenv_default_python_version }} (this takes a while)
  become: "{{ pyenv_default_python_user != ansible_user }}"
  become_user: "{{ pyenv_default_python_user }}"
  ansible.builtin.command: "{{ pyenv_default_python_root }}/bin/pyenv install {{ pyenv_default_python_version }}"
  when: not pyenv_python_installed.stat.exists

- name: Check if {{ pyenv_default_venv_name }} virtualenv already exists
  ansible.builtin.stat:
    path: "{{ pyenv_default_python_root }}/versions/{{ pyenv_default_python_version }}/envs/{{ pyenv_default_venv_name }}"
  register: pyenv_venv_exists

- name: Create {{ pyenv_default_venv_name }} virtualenv
  become: "{{ pyenv_default_python_user != ansible_user }}"
  become_user: "{{ pyenv_default_python_user }}"
  ansible.builtin.command: "{{ pyenv_default_python_root }}/bin/pyenv virtualenv {{ pyenv_default_python_version }} {{ pyenv_default_venv_name }}"
  when: not pyenv_venv_exists.stat.exists

- name: Read current pyenv global version
  ansible.builtin.slurp:
    src: "{{ pyenv_default_python_root }}/version"
  register: pyenv_current_global
  ignore_errors: true

- name: Set {{ pyenv_default_venv_name }} as global pyenv version
  become: "{{ pyenv_default_python_user != ansible_user }}"
  become_user: "{{ pyenv_default_python_user }}"
  ansible.builtin.command: "{{ pyenv_default_python_root }}/bin/pyenv global {{ pyenv_default_venv_name }}"
  when: >-
    pyenv_current_global is failed or
    (pyenv_current_global.content | b64decode | trim) != pyenv_default_venv_name
