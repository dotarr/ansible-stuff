---

- name: Install Crypttab
  apt:
    pkg:
      - cryptsetup
      - systemd-cryptsetup
    state: present
    update_cache: true

- name: Install LVM tools
  apt:
    pkg: lvm2
    state: present
  when: lvm_vg_name is defined

- name: Copy keyfile
  ansible.builtin.copy:
    src: "{{ luks_key }}"
    dest: "/etc/{{ luks_key | basename }}"
    owner: root
    mode: '0400'

- name: Add to Crypttab
  community.general.crypttab:
    backing_device: "UUID={{ luks_device_id }}"
    name: "{{ luks_key | basename }}"
    state: present
    opts: luks
    password: "/etc/{{ luks_key | basename }}"

- name: Force drive opening
  ansible.builtin.command: "cryptdisks_start {{ luks_key | basename }}"
  become: true
  args:
    creates: "/dev/mapper/{{ luks_key | basename }}"

- name: Activate LVM volume group
  ansible.builtin.command: "vgchange -ay {{ lvm_vg_name }}"
  register: vgchange_result
  changed_when: "'now active' in vgchange_result.stdout"
  when: lvm_vg_name is defined and mount

- name: Mount
  block:
    - name: Stat mountpoint
      stat:
        path: "{{ mountpoint }}"
      register: mp_stat

    - name: Create mountpoint
      ansible.builtin.file:
        path: "{{ mountpoint }}"
        state: directory
        mode: 0666
        owner: root
        group: users
      when: not mp_stat.stat.exists

    - name: Mount luks
      ansible.posix.mount:
        src: "{{ '/dev/' + lvm_vg_name + '/' + lvm_lv_name if lvm_vg_name is defined else '/dev/mapper/' + (luks_key | basename) }}"
        path: "{{ mountpoint }}"
        opts: "defaults,nofail"
        fstype: ext4
        state: mounted
  when: mount