---

- name: Copy flatpak system update systemd service
  ansible.builtin.template:
    src: flatpak-update.service.j2
    dest: /etc/systemd/system/flatpak-update.service
    owner: root
    group: root
    mode: '0644'

- name: Copy flatpak system update systemd timer
  ansible.builtin.template:
    src: flatpak-update.timer.j2
    dest: /etc/systemd/system/flatpak-update.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable and start flatpak system update timer
  ansible.builtin.systemd:
    name: flatpak-update.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Look up flatpak_updater_user's uid and home dir
  ansible.builtin.getent:
    database: passwd
    key: "{{ flatpak_updater_user }}"

- name: Check linger status for flatpak_updater_user
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ flatpak_updater_user }}"
  register: flatpak_updater_linger

- name: Enable linger for flatpak_updater_user
  ansible.builtin.command: "loginctl enable-linger {{ flatpak_updater_user }}"
  when: not flatpak_updater_linger.stat.exists

- name: Ensure user systemd dir exists
  become: true
  become_user: "{{ flatpak_updater_user }}"
  ansible.builtin.file:
    path: "{{ getent_passwd[flatpak_updater_user][4] }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Copy flatpak user update systemd service
  become: true
  become_user: "{{ flatpak_updater_user }}"
  ansible.builtin.template:
    src: flatpak-update-user.service.j2
    dest: "{{ getent_passwd[flatpak_updater_user][4] }}/.config/systemd/user/flatpak-update-user.service"
    mode: '0644'

- name: Copy flatpak user update systemd timer
  become: true
  become_user: "{{ flatpak_updater_user }}"
  ansible.builtin.template:
    src: flatpak-update-user.timer.j2
    dest: "{{ getent_passwd[flatpak_updater_user][4] }}/.config/systemd/user/flatpak-update-user.timer"
    mode: '0644'

- name: Enable and start flatpak user update timer
  become: true
  become_user: "{{ flatpak_updater_user }}"
  ansible.builtin.systemd:
    name: flatpak-update-user.timer
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[flatpak_updater_user][1] }}"
