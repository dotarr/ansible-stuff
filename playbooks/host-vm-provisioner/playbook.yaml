- name: Ubuntu Provisioner
  hosts: proxmox
  become: true
  gather_facts: false
  pre_tasks:
    - name: Lower host swappiness for VM-hosting workload
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/99-swappiness.conf
        state: present
        reload: true
  roles:
    - role: ../../roles/vm_template
      vars:
        vmid: 9003
        vm_name: cloud-deb
        disk_device: local
        ci_user: simon
        ci_pass: "{{ vault_proxmox_ci_pass }}"
        machine_type: q35
        bios_type: ovmf
        cpu_type: kvm64
        cpu_cores: 4
        ram: 4096
        disk_size: 30G
        ci_keys:
          - "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        image_link: https://cloud.debian.org/images/cloud/trixie/daily/latest/debian-13-generic-amd64-daily.qcow2
        image_dest: /var/lib/vz/template/iso/debian-13-generic-amd64-daily.qcow2
    - role: ../../roles/clone_vm
      vars:
        vm_name: vmdeb3
        template_id: 9003
        passthrough_gpu: true
        gpu_pci_address: "0000:00:02"
        passthrough_ssd_id: nvme-WDC_WDS480G2G0C-00AJM0_223764448712
    - role: ../../roles/vm_perf_tuning
      vars:
        target_vmid: "{{ vmid.stdout }}"

    # - role: ../../roles/import_omv
    #   vars:
    #     omv_backup_file: ../../vm-template-backups/vzdump-qemu-101-2023_05_20-14_56_21.vma.zst
    #     omv_template_id: 9005
    # - role: ../../roles/clone_vm
    #   vars:
    #     vm_name: omv
    #     template_id: 9005
    #     passthrough_gpu: false
    #     passthrough_ssd_id: ata-WDC_WD80EDAZ-11TA3A0_VDKJJL9K

    - role: ../../roles/vm_perf_tuning
      vars:
        target_vmid: 101 # omv, provisioned outside this repo (imported backup, not cloned)